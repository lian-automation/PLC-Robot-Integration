name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Truth table recheck (35 cases vs SCL logic)
        run: python scripts/真值表复算.py

      - name: Syntax check (compileall)
        run: python -m compileall -q scripts

      - name: AST full check (parse every Python source)
        run: |
          python - <<'PY'
          import ast, pathlib
          files = sorted(p for p in pathlib.Path(".").rglob("*.py")
                         if ".git" not in p.parts and "__pycache__" not in p.parts)
          assert files, "no Python files found"
          for f in files:
              ast.parse(f.read_text(encoding="utf-8"), filename=str(f))
          print(f"AST full check passed: {len(files)} Python file(s)")
          PY
